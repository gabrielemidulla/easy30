# Push a tag like `0.1.0` to publish the Obsidian plugin as a GitHub release
# (the format Obsidian's community plugin directory and BRAT expect).
name: Release Obsidian plugin

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check manifest version matches tag
        run: test "$(node -p "require('./packages/obsidian/manifest.json').version")" = "${GITHUB_REF_NAME}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            packages/obsidian/main.js packages/obsidian/manifest.json packages/obsidian/styles.css
